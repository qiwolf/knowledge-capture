<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识采集</title><link rel="stylesheet" href="ui.css"></head><body class="popup"><main>
<h1>采集当前网页</h1><p id="current-url">正在读取当前链接…</p>
<form id="capture-form"><label for="note">备注（选填）</label><textarea id="note" rows="2" maxlength="2000" placeholder="这条内容对你有什么用？"></textarea><button class="primary" id="capture" type="submit">开始采集</button></form>
<p class="status" id="status" role="status" aria-live="polite">正在读取任务状态…</p><p class="hint" id="task-id"></p>
<button id="refresh" type="button">刷新状态</button><button id="settings" type="button">服务设置</button>
<p class="hint">仅提交链接与备注。已接收不表示正文或图片已采集完成。</p></main><script type="module" src="popup.js"></script></body></html>
